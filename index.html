<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Castração</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <h1>Cadastro de Animais para Castração</h1>

    <form id="formCadastro">
        <h2>Dados do Tutor</h2>
        <label for="tutorNome">Nome do Tutor:</label>
        <input type="text" id="tutorNome" required><br>

        <label for="tutorTelefone">Telefone:</label>
        <input type="tel" id="tutorTelefone" required><br>

        <h2>Dados do Animal</h2>
        <label for="animalNome">Nome do Animal:</label>
        <input type="text" id="animalNome" required><br>

        <label for="animalEspecie">Espécie:</label>
        <input type="text" id="animalEspecie" required><br>

        <label for="animalRaca">Raça:</label>
        <input type="text" id="animalRaca"><br>

        <label for="animalIdade">Idade:</label>
        <input type="number" id="animalIdade"><br>

        <label for="animalSexo">Sexo:</label>
        <select id="animalSexo">
            <option value="Macho">Macho</option>
            <option value="Femea">Fêmea</option>
        </select><br>

        <label for="animalPeso">Peso (kg):</label>
        <input type="number" step="0.1" id="animalPeso"><br>

        <button type="submit">Cadastrar</button>
    </form>

    <h2>Cadastros</h2>
    <div id="listaCadastros"></div>

    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
